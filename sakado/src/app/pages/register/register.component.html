<body class="bg-gradient-to-br from-blue-50 to-cyan-100  h-screen font-[Tajawal] overflow-hidden [direction:rtl]">
  <div class="   flex items-center justify-center  [direction:rtl]">
    <div class="  w-full flex flex-col md:flex-row bg-white rounded-2xl overflow-hidden shadow-[0_20px_50px_rgba(11,83,148,0.15)]">
      
      <!-- Right Side - Image -->
      <div class="w-full md:w-2/5 bg-gradient-to-br from-blue-900 to-cyan-400 flex flex-col items-center justify-center p-8 text-white text-center relative overflow-hidden">
        <div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPgoJPGxpbmUgeDE9IjAiIHkxPSIwIiB4Mj0iMTAwJSIgeTI9IjEwMCUiIHN0cm9rZT0iIzQ0Y2JkNSIgc3Ryb2tlLW9wYWNpdHk9IjAuMSIgc3Ryb2tlLXdpZHRoPSIyIi8+Cgk8bGluZSB4MT0iMTAwJSIgeTE9IjAiIHgyPSIwIiB5Mj0iMTAwJSIgc3Ryb2tlPSIjNDRjYmQ1IiBzdHJva2Utb3BhY2l0eT0iMC4xIiBzdHJva2Utd2lkdGg9IjIiLz4KPC9zdmc+')]"></div>
        
        <div class="relative z-10">
          <h2 class="text-3xl md:text-4xl font-bold mb-6">ابدأ مغامرتك السياحية</h2>
          <p class="text-lg mb-8 max-w-md mx-auto">انضم إلى آلاف المسافرين الذين يستكشفون الوجهات الأكثر روعة في العالم مع عروضنا الحصرية ومجتمعنا.</p>
          
          <div class="grid grid-cols-3 gap-4 max-w-xs mx-auto">
            <div class="bg-white/20 p-4 rounded-xl backdrop-blur-sm">
              <i class="fas fa-map-marked-alt text-3xl mb-2"></i>
              <p>الوجهات</p>
            </div>
            <div class="bg-white/20 p-4 rounded-xl backdrop-blur-sm">
              <i class="fas fa-tags text-3xl mb-2"></i>
              <p>عروض حصرية</p>
            </div>
            <div class="bg-white/20 p-4 rounded-xl backdrop-blur-sm">
              <i class="fas fa-users text-3xl mb-2"></i>
              <p>المجتمع</p>
            </div>
          </div>
          
          <div class="mt-10 flex justify-center">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'%3E%3Cpath d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z'/%3E%3C/svg%3E" alt="Travel" class="w-16 h-16 mt-6 opacity-80" />
          </div>
        </div>
      </div>
      
      <!-- Left Side - Form -->
      <div class="w-full md:w-3/5   md:p-10">
        <div class="text-center  ">
          <!-- <div class="flex justify-center mb-4">
            <div class="bg-gray-200 border-2 border-dashed rounded-xl w-16 h-16 flex items-center justify-center text-cyan-400">
              <i class="fas fa-user-plus text-3xl"></i>
            </div>
          </div> -->
          <h1 class="text-3xl md:text-4xl font-bold text-blue-900 mb-2">إنشاء حساب جديد</h1>
          <p class="text-gray-600">انضم لمجتمع السفر وابدأ رحلتك السياحية</p>
        </div>
        
        <form class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="relative mb-6">
              <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-cyan-400"></i>
              <input type="text" placeholder="الاسم الأول" class="w-full py-2 px-14 text-lg rounded-xl border-2 border-gray-200 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30 transition-all duration-300 placeholder-gray-500 text-gray-800" />
            </div>
            
            <div class="relative mb-6">
              <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-cyan-400"></i>
              <input type="text" placeholder="اسم العائلة" class="w-full py-2 px-14 text-lg rounded-xl border-2 border-gray-200 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30 transition-all duration-300 placeholder-gray-500 text-gray-800" />
            </div>
          </div>
             <div class="relative mb-6 ">
            <i class="fas fa-phone absolute left-3 top-1/2 -translate-y-1/2 text-cyan-400 "></i>
            <input type="tel" placeholder="رقم الهاتف" class=" w-full py-2 px-14 text-lg rounded-xl border-2 border-gray-200 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30 transition-all duration-300 placeholder-gray-500 text-gray-800" />
          </div>
          <div class="relative mb-6">
            <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-cyan-400"></i>
            <input type="email" placeholder="البريد الإلكتروني" class="w-full py-2 px-14 text-lg rounded-xl border-2 border-gray-200 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30 transition-all duration-300 placeholder-gray-500 text-gray-800" />
          </div>
          
       
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="relative mb-6">
              <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-cyan-400"></i>
              <input type="password" placeholder="كلمة المرور" class="w-full py-2 px-14 text-lg rounded-xl border-2 border-gray-200 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30 transition-all duration-300 placeholder-gray-500 text-gray-800" />
            </div>
            
            <div class="relative mb-6">
              <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-cyan-400"></i>
              <input type="password" placeholder="تأكيد كلمة المرور" class="w-full py-2 px-14 text-lg rounded-xl border-2 border-gray-200 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30 transition-all duration-300 placeholder-gray-500 text-gray-800" />
            </div>
          </div>
          
          <div class="flex items-center mb-4">
            <input type="checkbox" id="terms" class="h-5 w-5 text-cyan-400 rounded border-gray-300 focus:ring-cyan-400" />
            <label for="terms" class="mr-2 block text-base text-gray-700">
              أوافق على <a href="#" class="text-cyan-400 font-medium hover:underline">الشروط والأحكام</a>
            </label>
          </div>
          
          <button type="submit" class="w-full py-2 text-xl rounded-xl bg-gradient-to-r from-cyan-400 to-blue-900 text-white font-bold tracking-wide shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all duration-300">
            إنشاء حساب <i class="fas fa-arrow-left mr-2"></i>
          </button>
          
          <div class="text-center mt-6">
            <p class="text-gray-600">أو سجل باستخدام</p>
            <div class="flex gap-4 mt-4">
              <button class="flex-1 py-4 rounded-xl border border-gray-300 flex items-center justify-center hover:border-cyan-400 hover:bg-cyan-400/10 transition-all duration-300">
                <i class="fab fa-google text-red-500 text-xl"></i>
              </button>
              <button class="flex-1 py-4 rounded-xl border border-gray-300 flex items-center justify-center hover:border-cyan-400 hover:bg-cyan-400/10 transition-all duration-300">
                <i class="fab fa-facebook text-blue-600 text-xl"></i>
              </button>
              <button class="flex-1 py-4 rounded-xl border border-gray-300 flex items-center justify-center hover:border-cyan-400 hover:bg-cyan-400/10 transition-all duration-300">
                <i class="fab fa-twitter text-blue-400 text-xl"></i>
              </button>
            </div>
          </div>
          
          <div class="text-center mt-8">
            <p class="text-gray-700">هل لديك حساب بالفعل؟ 
              <a href="#" class="text-cyan-400 font-medium hover:underline" routerLink="/auth/login">تسجيل الدخول</a>
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
  
 
   <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet" />
</body>
