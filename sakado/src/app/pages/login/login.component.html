<div
  class="bg-gradient-to-br from-blue-50 to-cyan-100 h-screen font-[Tajawal] overflow-hidden [direction:rtl]"
>
  <div
    class="flex h-screen items-stretch justify-center [direction:rtl] w-full"
  >
    <div
      class="w-full flex flex-col md:flex-row bg-white rounded-2xl overflow-hidden shadow-[0_20px_50px_rgba(11,83,148,0.15)]"
      style="height: 100%"
    >
      <!-- Right Side - Image -->
      <div
        class="w-full md:w-2/5 bg-gradient-to-br from-[#253808] to-[#b5e249] flex flex-col items-center justify-center p-8 text-white text-center relative overflow-hidden"
      >
        <div
          class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPgoJPGxpbmUgeDE9IjAiIHkxPSIwIiB4Mj0iMTAwJSIgeTI9IjEwMCUiIHN0cm9rZT0iIzQ0Y2JkNSIgc3Ryb2tlLW9wYWNpdHk9IjAuMSIgc3Ryb2tlLXdpZHRoPSIyIi8+Cgk8bGluZSB4MT0iMTAwJSIgeTE9IjAiIHgyPSIwIiB5Mj0iMTAwJSIgc3Ryb2tlPSIjNDRjYmQ1IiBzdHJva2Utb3BhY2l0eT0iMC4xIiBzdHJva2Utd2lkdGg9IjIiLz4KPC9zdmc+')]"
        ></div>

        <div class="relative z-10">
          <h2 class="text-3xl md:text-4xl font-bold mb-6">مرحبا بعودتك</h2>
          <p class="text-lg mb-8 max-w-md mx-auto">
            سجل دخولك للانضمام إلى مجتمع السفر وابدأ رحلتك السياحية معنا.
          </p>

          <div class="grid grid-cols-3 gap-4 max-w-xs mx-auto">
            <div class="bg-white/20 p-4 rounded-xl backdrop-blur-sm">
              <i class="fas fa-map-marked-alt text-3xl mb-2"></i>
              <p>الوجهات</p>
            </div>
            <div class="bg-white/20 p-4 rounded-xl backdrop-blur-sm">
              <i class="fas fa-tags text-3xl mb-2"></i>
              <p>عروض حصرية</p>
            </div>
            <div class="bg-white/20 p-4 rounded-xl backdrop-blur-sm">
              <i class="fas fa-users text-3xl mb-2"></i>
              <p>المجتمع</p>
            </div>
          </div>

          <div class="mt-10 flex justify-center">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'%3E%3Cpath d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z'/%3E%3C/svg%3E"
              alt="Travel"
              class="w-16 h-16 mt-6 opacity-80"
            />
          </div>
        </div>
      </div>

      <!-- Left Side - Login Form -->
      <div class="w-full md:w-3/5 p-8 md:p-10 flex flex-col justify-center">
        <div class="text-center mb-8">
          <h1 class="text-3xl md:text-4xl font-bold text-blue-900 mb-2">
            تسجيل الدخول
          </h1>
          <p class="text-gray-600">سجل دخولك للمتابعة</p>
        </div>

        <form class="space-y-4">
          <div class="relative mb-6">
            <i
              class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-[#253808]"
            ></i>
            <input
              type="password"
              name="password"
              placeholder=" password  "
              class="w-full py-2 px-14 text-lg rounded-xl border-2 border-gray-200 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30 transition-all duration-300 placeholder-gray-500 text-gray-800"
              required
              [(ngModel)]="loginObj.password"
            />
          </div>
<!-- emilyspass
emilys -->
          <div class="relative mb-6">
            <i
              class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-[#253808]"
            ></i>
            <input
              type="text"
              name="username"
              [(ngModel)]="loginObj.username"
              placeholder="  username"
              class="w-full py-2 px-14 text-lg rounded-xl border-2 border-gray-200 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/30 transition-all duration-300 placeholder-gray-500 text-gray-800"
              required
            />
          </div>

          <div class="flex justify-between items-center mb-6">
            <label class="flex items-center text-gray-700">
              <input
                type="checkbox"
                class="h-5 w-5 text-[#253808] rounded border-gray-300 focus:ring-cyan-400"
              />
              <span class="mr-2">تذكرني</span>
            </label>
            <a href="#" class="text-[#253808] font-medium hover:underline"
              >نسيت كلمة المرور؟</a
            >
          </div>

          <button
            type="submit"
            class="w-full py-2 text-xl rounded-xl bg-gradient-to-br from-[#253808] to-[#b5e249] text-white font-bold tracking-wide shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all duration-300"
            (click)="login()"
          >
            تسجيل الدخول
          </button>

          <div class="text-center mt-6">
            <p class="text-gray-600">أو سجل باستخدام</p>
            <div class="flex gap-4 mt-4">
              <button
                class="flex-1 py-4 rounded-xl border border-gray-300 flex items-center justify-center hover:border-[#253808] hover:bg-[#253808]/10 transition-all duration-300"
              >
                <i class="fab fa-google text-red-500 text-xl"></i>
              </button>
              <button
                class="flex-1 py-4 rounded-xl border border-gray-300 flex items-center justify-center hover:border-[#253808] hover:bg-[#253808]/10 transition-all duration-300"
              >
                <i class="fab fa-facebook text-blue-600 text-xl"></i>
              </button>
              <button
                class="flex-1 py-4 rounded-xl border border-gray-300 flex items-center justify-center hover:border-[#253808] hover:bg-[#253808]/10 transition-all duration-300"
              >
                <i class="fab fa-twitter text-blue-400 text-xl"></i>
              </button>
            </div>
          </div>

          <div class="text-center mt-8">
            <p class="text-gray-700">
              ليس لديك حساب؟
              <a
                href="#"
                class="text-[#253808] font-medium hover:underline"
                routerLink="/auth/register"
                >إنشاء حساب جديد</a
              >
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Required CSS -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css"
    rel="stylesheet"
  />
</div>
