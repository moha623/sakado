<body class="relative">
  <!-- Spinner Start -->
  <!-- <div id="spinner" class="fixed inset-0 flex items-center justify-center bg-white w-full h-screen z-50">
    <div class="animate-spin rounded-full border-4 border-blue-500 border-t-transparent h-12 w-12"></div>
    <span class="sr-only">Loading...</span>
  </div> -->
  <!-- Spinner End -->


  <!-- Contact Start -->
  <div class="max-w-7xl mx-auto py-12 px-4">
    <div class="text-center mb-10">
      <h6 class="inline-block bg-white text-blue-600 px-3 py-1 rounded text-sm font-semibold">Contact Us</h6>
      <h1 class="text-3xl font-bold mb-5">Contact For Any Query</h1>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Contact Info -->
      <div>
        <h5 class="text-lg font-semibold mb-2">Get In Touch</h5>
        <p class="mb-4 text-gray-600">Tempor erat elitr rebum at clita. Diam dolor diam ipsum sit. Aliqu diam amet diam et eos</p>
        <div class="flex items-center mb-4">
          <div class="flex items-center justify-center bg-[#86b817] w-12 h-12 rounded">
            <i class="fa fa-map-marker-alt text-white"></i>
          </div>
          <div class="ml-3">
            <h5 class="text-blue-600 font-semibold">Office</h5>
            <p class="mb-0 text-gray-700">123 Street, New York, USA</p>
          </div>
        </div>
        <div class="flex items-center mb-4">
          <div class="flex items-center justify-center bg-[#86b817] w-12 h-12 rounded">
            <i class="fa fa-phone-alt text-white"></i>
          </div>
          <div class="ml-3">
            <h5 class="text-blue-600 font-semibold">Mobile</h5>
            <p class="mb-0 text-gray-700">+012 345 67890</p>
          </div>
        </div>
        <div class="flex items-center">
          <div class="flex items-center justify-center bg-[#86b817] w-12 h-12 rounded">
            <i class="fa fa-envelope-open text-white"></i>
          </div>
          <div class="ml-3">
            <h5 class="text-blue-600 font-semibold">Email</h5>
            <p class="mb-0 text-gray-700">infoATexample.com</p>
          </div>
        </div>
      </div>
      <!-- Map -->
      <div>
        <iframe class="relative rounded w-full h-full min-h-[300px] border-0" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3001156.4288297426!2d-78.01371936852176!3d42.72876761954724!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4ccc4bf0f123a5a9%3A0xddcfc6c1de189567!2sNew%20York%2C%20USA!5e0!3m2!1sen!2sbd!4v1603794290143!5m2!1sen!2sbd" allowfullscreen="" aria-hidden="false" tabindex="0"></iframe>
      </div>
      <!-- Contact Form -->
      <div>
        <form>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
              <label htmlFor="name" class="block text-sm text-gray-700 mb-1">Your Name</label>
              <input type="text" id="name" placeholder="Your Name" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600"/>
            </div>
            <div>
              <label htmlFor="email" class="block text-sm text-gray-700 mb-1">Your Email</label>
              <input type="email" id="email" placeholder="Your Email" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600"/>
            </div>
          </div>
          <div class="mb-4">
            <label htmlFor="subject" class="block text-sm text-gray-700 mb-1">Subject</label>
            <input type="text" id="subject" placeholder="Subject" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600"/>
          </div>
          <div class="mb-4">
            <label htmlFor="message" class="block text-sm text-gray-700 mb-1">Message</label>
            <textarea id="message" placeholder="Leave a message here" class="w-full border border-gray-300 rounded px-3 py-2 h-24 focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
          </div>
          <button class="bg-[#86b817] text-white w-full py-3 rounded hover:bg-blue-700 transition" type="submit">Send Message</button>
        </form>
      </div>
    </div>
  </div>
  <!-- Contact End -->

 

  <!-- Back to Top -->
  <a href="#" class="fixed bottom-6 right-6 bg-blue-600 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-lg hover:bg-blue-700 transition"><i class="bi bi-arrow-up"></i></a>
</body>
