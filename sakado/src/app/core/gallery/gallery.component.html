 
<div>
 

    <!-- Hero Section -->
    <section class="hero">
         <a href="#" class="back-btn bg-blue-600 rounded-full p-3 shadow-lg text-gray-700 hover:bg-gray-100 transition">
    <i class="fas fa-arrow-left"></i>
  </a>
        <div class="hero-content">
            <h1>استكشف جمال العالم من خلال عدستنا</h1>
            <p>معرض ساكادو يقدم لكم أجمل اللحظات والمناظر من رحلاتنا حول العالم</p>
        </div>
    </section>
 
    <!-- Gallery Controls -->
    <section class="gallery-controls">
        <div class="controls-container">
            <div class="search-box">
                <input type="text" placeholder="ابحث عن وجهة أو مكان...">
                <button><i class="fas fa-search"></i></button>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active">الكل</button>
                <button class="filter-btn">طبيعة</button>
                <button class="filter-btn">مدن</button>
                <button class="filter-btn">شواطئ</button>
                <button class="filter-btn">تاريخية</button>
                <button class="filter-btn">ثقافية</button>
            </div>
        </div>
    </section>

    <!-- Gallery Grid -->
    <section class="gallery-grid">
        <div class="grid-container">
            <!-- Item 1 -->
        <div class="gallery-item" *ngFor="let photo of photos;  " id="item-1">
  <img [src]="photo.url" [alt]="photo.caption" class="gallery-image" />
  <div class="item-overlay">
    <h3 class="item-title">{{ photo.caption }}</h3>
    <div class="item-location">
      <i class="fas fa-map-marker-alt"></i>
      <span>{{ photo.category }}</span>
    </div>
  </div>
</div>

 
        </div>
        
        <div class="pagination">
            <button class="active">1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button><i class="fas fa-arrow-left"></i></button>
        </div>
    </section>

</div>
