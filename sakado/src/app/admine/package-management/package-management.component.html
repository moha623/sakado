<!-- package-management.component.html -->
<div class="main-content" dir="rtl">
  <div id="packageManagement">
    <div class="table-container">
      <div class="table-header">
        <div class="card-title">إدارة الرحلات</div>
        <div class="table-actions">
          <button class="btn btn-outline">
            <i class="fas fa-filter"></i>
            فلترة
          </button>
          <button class="btn btn-primary" (click)="scrollToForm()">
            <i class="fas fa-plus"></i>
            إضافة رحلة
          </button>
        </div>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>اسم الرحلة</th>
            <th>التصنيف</th>
            <th>الوجهة</th>
            <th>السعر</th>
            <th>الحالة</th>
            <th>المشاركون</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let trip of trips">
            <td>{{ trip.name }}</td>
            <td>{{ trip.category }}</td>
            <td>{{ trip.destination }}</td>
            <td>${{ trip.price }}</td>
            <td>
              <span [ngClass]="getStatusClass(trip.status)">
                {{ getStatusText(trip.status) }}
              </span>
            </td>
            <td>{{ trip.participants }}</td>
            <td class="action-cell">
              <div class="action-btn view-btn">
                <i class="fas fa-eye"></i>
              </div>
              <div class="action-btn edit-btn">
                <i class="fas fa-edit"></i>
              </div>
              <div class="action-btn delete-btn">
                <i class="fas fa-trash"></i>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Package Form -->
    <div class="form-container" id="section1">
      <div class="form-header">
        <div class="card-title">إضافة رحلة جديدة</div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>اسم الرحلة</label>
          <input type="text" class="form-control" placeholder="أدخل اسم الرحلة" 
                 [(ngModel)]="newTrip.name" />
        </div>

        <div class="form-group">
          <label>التصنيف</label>
          <select class="form-control" [(ngModel)]="newTrip.category">
            <option value="">اختر التصنيف</option>
            <option *ngFor="let category of categories" [value]="category">
              {{ category }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>الوجهة / المكان</label>
          <input type="text" class="form-control" placeholder="أدخل اسم الوجهة" 
                 [(ngModel)]="newTrip.destination" />
        </div>

        <div class="form-group">
          <label>الحالة</label>
          <select class="form-control" [(ngModel)]="newTrip.status">
            <option *ngFor="let status of statusOptions" [value]="getStatusValue(status)">
              {{ status }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>تاريخ البدء</label>
          <input type="date" class="form-control" 
                 [value]="newTrip.startDate | date:'yyyy-MM-dd'"
                   />
        </div>

        <div class="form-group">
          <label>تاريخ الانتهاء</label>
          <input type="date" class="form-control" 
                 [value]="newTrip.endDate | date:'yyyy-MM-dd'"
                   />
        </div>

        <div class="form-group">
          <label>عدد المشاركين الأقصى</label>
          <input type="number" class="form-control" value="20" 
                 [(ngModel)]="newTrip.maxParticipants" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>السعر الأساسي</label>
          <input type="number" class="form-control" placeholder="$0.00" 
                 [(ngModel)]="newTrip.price" />
        </div>

        <div class="form-group">
          <label>سعر التخفيض (اختياري)</label>
          <input type="number" class="form-control" placeholder="$0.00" 
                 [(ngModel)]="newTrip.discountPrice" />
        </div>
      </div>

      <div class="form-group">
        <label>وصف الرحلة</label>
        <textarea class="form-control" rows="4" placeholder="أدخل وصفًا تفصيليًا للرحلة"
                  [(ngModel)]="newTrip.description"></textarea>
      </div>

      <div class="form-group">
        <label>برنامج الرحلة (يوم بيوم)</label>
        <textarea class="form-control" rows="6" placeholder="أدخل تفاصيل برنامج الرحلة"
                  [(ngModel)]="newTrip.itinerary"></textarea>
      </div>

      <div class="form-group">
        <label>الصور</label>
        <div style="border: 2px dashed #ddd; border-radius: 8px; padding: 20px; text-align: center;" (click)="fileInput.click()">
          <i class="fas fa-cloud-upload-alt" style="font-size: 2rem; color: #999; margin-bottom: 10px"></i>
          <p style="color: #666" >اسحب الصور هنا أو انقر للتحميل</p>
          <input type="file" style="display: none" #fileInput (change)="onFileSelected($event)">
          <button class="btn btn-sm btn-outline-primary" >اختر صورة</button>
        </div>
      </div>

      <div class="form-footer">
        <button class="btn btn-outline">إلغاء</button>
        <button class="btn btn-primary" (click)="addNewTrip()">حفظ الرحلة</button>
      </div>
    </div>
  </div>
</div>
